# foot terminal settings for the wolfDemo display. Installed to /opt/wolfdemo
# by setup.sh, which fills in the values between @ signs.

[main]
# JetBrains Mono, with slashed zeros
font=JetBrains Mono:pixelsize=@FONT_SIZE@:fontfeatures=zero
# Tighter than the font's own line spacing, to fit more table rows
line-height=@LINE_HEIGHT@px
# Centre the character grid on the screen
pad=0x0 center

[colors]
background=@BACKGROUND@
foreground=@FOREGROUND@

[bell]
system=no
